name: Daily research pilot

"on":
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: venture-research-state
  cancel-in-progress: false

jobs:
  research:
    if: github.repository == 'nikelef/venture-ai-ceo' && github.ref == 'refs/heads/main' && vars.VENTURE_RESEARCH_ENABLED == 'true' && vars.VENTURE_GITHUB_ZERO_SPEND_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      MONTHLY_BUDGET_EUR: '0'
      MAX_LLM_CALLS_PER_RUN: '0'
      PAYMENTS_ENABLED: 'false'
      MAX_RUNS_PER_DAY: '4'
      AI_CEO_SHUTDOWN: ${{ vars.VENTURE_SHUTDOWN || 'false' }}
      CLOUD_ZERO_SPEND_CONFIRMED: ${{ vars.VENTURE_GITHUB_ZERO_SPEND_CONFIRMED }}
      CLOUD_BOOTSTRAP_ALLOWED: ${{ vars.VENTURE_CLOUD_BOOTSTRAP_ALLOWED }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify runtime and product
        run: |
          python -m unittest discover -s tests -v
          node --test tests/catalog.test.cjs
      - name: Restore, research and checkpoint
        id: research
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ai_ceo.cloud
      - name: Retain private research state
        if: always() && steps.research.outputs.state_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venture-research-state
          path: |
            runtime/cloud-artifact/research.sqlite3
            runtime/cloud-artifact/state.json
            runtime/cloud-artifact/decision.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
