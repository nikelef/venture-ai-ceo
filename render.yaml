# Static evaluator. Owner confirmed no Render payment method and authorized
# publication. Quota exhaustion must stop usage; never upgrade automatically.
services:
  - type: web
    name: venture-ai-ceo-evaluator
    runtime: static
    repo: https://github.com/nikelef/venture-ai-ceo
    branch: main
    autoDeployTrigger: commit
    buildCommand: node --test tests/catalog.test.cjs
    staticPublishPath: ./web
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://br-polished-feather-ba3h1u8g-evidence.compute.c-8.eu-central-1.aws.neon.tech; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
