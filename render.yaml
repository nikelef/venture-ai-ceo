# Prepared configuration only. DO NOT APPLY until EUR 0 usage safeguards,
# private-repository access and the operator/privacy notice are verified.
# Static hosting still has bandwidth and build overage risks.
services:
  - type: web
    name: venture-ai-ceo-evaluator
    runtime: static
    repo: https://github.com/nikelef/venture-ai-ceo
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: node --test tests/catalog.test.cjs
    staticPublishPath: ./web
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
